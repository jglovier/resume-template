# Software Development Intern
- company: Innosa Software Technologies Inc.
  position: Software Development Intern
  duration:   June, 2025  &mdash; July, 2025
  summary: During this internship, I gained comprehensive experience in developing cross-platform mobile applications using React Native and Expo. I built a app from scratch that allows users to create accounts, add products, update their profiles, follow others, and manage privacy settings. The project integrated multiple Firebase services including Firebase Authentication, Firestore (NoSQL real-time database), Firebase Storage, and Expo Push Notifications. I worked extensively with Firestore queries, async/await operations, and modular component structures to ensure scalable and maintainable architecture. Throughout the project, I focused on key features such as real-time messaging using Firestore listeners, secure user authentication with persistent sessions, media upload (images) to Firebase Storage, and conditional UI updates based on user actions. I implemented dynamic navigation flows using React Navigation (Stack, Tab, and Modal navigators) and managed state using useState, useEffect, useFocusEffect, and custom hooks. For user interaction, I integrated features like followers/following logic, product listings with FlatList, real-time comment systems, and user-defined privacy preferences (e.g., who can follow or comment). I handled edge cases like empty fields, failed fetches, and restricted access by designing fallback mechanisms and permission-based logic. The app followed a clean architecture approach with reusable components and Firebase abstraction layers for scalability. I also ensured performance optimization by minimizing unnecessary renders and loading operations. This experience helped me strengthen my practical knowledge of mobile development and enhanced my ability to work independently, write clean code, troubleshoot efficiently, and design user-focused features from the ground up.
