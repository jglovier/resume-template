resume_header_intro: "<p>QA Engineer and Test Lead with 6+ years of experience in manual and automated testing across web, hybrid, and mobile applications. Skilled in test case design, automation frameworks, and QA team leadership. Strong analytical mindset with expertise in Agile, CI/CD pipelines, and modern testing practices. Dedicated to delivering high-quality software products.</p>"

