# Site settings
title: "Kaan Karahasan"
description: "A website for Kaan Karahasan – Junior Software Development"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Kaan KARAHASAN"
resume_title:                   "Junior Software Developer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "kaankarahasan@yahoo.com"

# the next two items are used for schema itemprops in _layouts/resume.html
# resume_contact_telephone:       "555-7334"
resume_contact_address:         "Bursa, Turkey"

resume_header_contact_info:     "Bursa, Turkey • kaankarahasan@yahoo.com"
display_header_contact_info:    "false"

resume_header_intro: |
  <p>I’m a Computer Engineering student with a strong interest in mobile development, user-centric software design, and cloud-based systems. I focus on building cross-platform solutions using modern technologies such as React Native and Firebase. I value not just functional code, but also clean, maintainable, and high-performance solutions.</p>
  
  <p>I'm motivated by solving real-world problems through software, continuously learning new technologies, and improving my problem-solving skills. I’m a developer who thrives in collaborative environments, takes initiative, and is always eager to grow professionally.</p>


# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
